# Construit l'appli et la publie sur GitHub Pages.
# - à chaque modification envoyée sur la branche main (avec le patch indiqué dans le fichier PATCH) ;
# - à la demande : onglet Actions > « Construire et publier » > Run workflow.
#   Cocher « Passer au dernier patch de Riot » pour mettre à jour icônes, noms et prix.
# Aucune mise à jour automatique : le patch ne change que sur demande.
name: Construire et publier

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nouveau_patch:
        description: "Passer au dernier patch de Riot"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Pillow (compression des icônes)
        run: pip install pillow==11.0.0

      - name: Chercher un nouveau patch (sur demande uniquement)
        id: patch
        if: github.event_name == 'workflow_dispatch' && inputs.nouveau_patch
        run: python build/check_patch.py

      - name: Construire l'appli
        run: python build/build.py

      - name: Enregistrer le nouveau patch dans le dépôt
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PATCH
          git commit -m "Patch ${{ steps.patch.outputs.patch }} : mise à jour demandée"
          git push

      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
